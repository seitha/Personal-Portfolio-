<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Edkal Electrical - Project Gallery</title>


    <style>

        /* =========================================
           TABBED GALLERY ONLY
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, sans-serif;
            background: #ffffff;
        }


        /* =========================================
           GALLERY SECTION
        ========================================= */

        .edkal-gallery-section {

            width: 100%;

            padding: 80px 20px;

            background: #ffffff;

        }


        .edkal-gallery-container {

            width: 100%;

            max-width: 1150px;

            margin: 0 auto;

        }


        /* =========================================
           HEADER
        ========================================= */

        .edkal-gallery-header {

            text-align: center;

            max-width: 700px;

            margin: 0 auto 45px;

        }


        .edkal-gallery-header small {

            display: block;

            margin-bottom: 10px;

            color: #e5ad00;

            font-size: 13px;

            font-weight: 700;

            letter-spacing: 3px;

            text-transform: uppercase;

        }


        .edkal-gallery-header h2 {

            margin-bottom: 12px;

            color: #111111;

            font-size: 42px;

            line-height: 1.1;

            font-weight: 800;

        }


        .edkal-gallery-header p {

            max-width: 600px;

            margin: 0 auto;

            color: #666666;

            font-size: 15px;

            line-height: 1.7;

        }


        /* =========================================
           TABS
        ========================================= */

        .edkal-gallery-tabs {

            display: flex;

            justify-content: center;

            align-items: center;

            flex-wrap: wrap;

            gap: 10px;

            margin-bottom: 40px;

        }


        .edkal-gallery-tab {

            appearance: none;

            padding: 12px 24px;

            border: 1px solid #dddddd;

            border-radius: 5px;

            background: #ffffff;

            color: #222222;

            font-family: Arial, sans-serif;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            transition:
                background .3s ease,
                color .3s ease,
                border-color .3s ease,
                transform .3s ease;

        }


        .edkal-gallery-tab:hover {

            border-color: #f2bd00;

            transform: translateY(-2px);

        }


        .edkal-gallery-tab.active {

            background: #f2bd00;

            border-color: #f2bd00;

            color: #111111;

        }


        /* =========================================
           GALLERY GRID
        ========================================= */

        .edkal-gallery-grid {

            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 20px;

        }


        /* =========================================
           GALLERY IMAGE
        ========================================= */

        .edkal-gallery-item {

            position: relative;

            width: 100%;

            height: 280px;

            overflow: hidden;

            background: #eeeeee;

            border-radius: 8px;

            animation: edkalGalleryAppear .35s ease;

        }


        .edkal-gallery-item img {

            width: 100%;

            height: 100%;

            display: block;

            object-fit: cover;

            cursor: pointer;

            transition:
                transform .45s ease;

        }


        .edkal-gallery-item:hover img {

            transform: scale(1.06);

        }


        /* =========================================
           HIDDEN IMAGE
        ========================================= */

        .edkal-gallery-item.hidden {

            display: none;

        }


        /* =========================================
           ANIMATION
        ========================================= */

        @keyframes edkalGalleryAppear {

            from {

                opacity: 0;

                transform: translateY(10px);

            }

            to {

                opacity: 1;

                transform: translateY(0);

            }

        }


        /* =========================================
           TABLET
        ========================================= */

        @media (max-width: 850px) {

            .edkal-gallery-section {

                padding: 65px 20px;

            }


            .edkal-gallery-grid {

                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

            }


            .edkal-gallery-item {

                height: 250px;

            }

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 550px) {

            .edkal-gallery-section {

                padding: 55px 15px;

            }


            .edkal-gallery-header h2 {

                font-size: 32px;

            }


            .edkal-gallery-header p {

                font-size: 14px;

            }


            .edkal-gallery-tabs {

                gap: 7px;

            }


            .edkal-gallery-tab {

                padding: 10px 15px;

                font-size: 12px;

            }


            .edkal-gallery-grid {

                grid-template-columns: 1fr;

                gap: 15px;

            }


            .edkal-gallery-item {

                height: 240px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         EDKAL PROJECT GALLERY
    ========================================== -->

    <section class="edkal-gallery-section">

        <div class="edkal-gallery-container">


            <!-- HEADER -->

            <div class="edkal-gallery-header">

                <small>
                    Our Work
                </small>

                <h2>
                    Project Gallery
                </h2>

                <p>
                    Explore our electrical installation,
                    maintenance, lighting and repair projects.
                </p>

            </div>


            <!-- =================================
                 TABS
            ================================== -->

            <div class="edkal-gallery-tabs">


                <button
                    type="button"
                    class="edkal-gallery-tab active"
                    data-filter="all">

                    All

                </button>


                <button
                    type="button"
                    class="edkal-gallery-tab"
                    data-filter="installation">

                    Installation

                </button>


                <button
                    type="button"
                    class="edkal-gallery-tab"
                    data-filter="maintenance">

                    Maintenance

                </button>


                <button
                    type="button"
                    class="edkal-gallery-tab"
                    data-filter="lighting">

                    Lighting

                </button>


                <button
                    type="button"
                    class="edkal-gallery-tab"
                    data-filter="repairs">

                    Repairs

                </button>


            </div>


            <!-- =================================
                 GALLERY
            ================================== -->

            <div class="edkal-gallery-grid">


                <!-- INSTALLATION 1 -->

                <div
                    class="edkal-gallery-item"
                    data-category="installation">

                    <img
                        src="https://images.unsplash.com/photo-1621905252507-b35492cc74b4?auto=format&fit=crop&w=1000&q=80"
                        alt="Electrical installation">

                </div>


                <!-- MAINTENANCE 1 -->

                <div
                    class="edkal-gallery-item"
                    data-category="maintenance">

                    <img
                        src="https://images.unsplash.com/photo-1581092160607-ee22621dd758?auto=format&fit=crop&w=1000&q=80"
                        alt="Electrical maintenance">

                </div>


                <!-- LIGHTING 1 -->

                <div
                    class="edkal-gallery-item"
                    data-category="lighting">

                    <img
                        src="https://images.unsplash.com/photo-1565814329452-e1efa11c5b89?auto=format&fit=crop&w=1000&q=80"
                        alt="Lighting installation">

                </div>


                <!-- REPAIRS 1 -->

                <div
                    class="edkal-gallery-item"
                    data-category="repairs">

                    <img
                        src="https://images.unsplash.com/photo-1625047509248-ec889cbff17f?auto=format&fit=crop&w=1000&q=80"
                        alt="Electrical repair">

                </div>


                <!-- INSTALLATION 2 -->

                <div
                    class="edkal-gallery-item"
                    data-category="installation">

                    <img
                        src="https://images.unsplash.com/photo-1621905251918-48416bd8575a?auto=format&fit=crop&w=1000&q=80"
                        alt="Electrical wiring">

                </div>


                <!-- MAINTENANCE 2 -->

                <div
                    class="edkal-gallery-item"
                    data-category="maintenance">

                    <img
                        src="https://images.unsplash.com/photo-1581092919535-7146ff1a590e?auto=format&fit=crop&w=1000&q=80"
                        alt="Electrical maintenance work">

                </div>


                <!-- LIGHTING 2 -->

                <div
                    class="edkal-gallery-item"
                    data-category="lighting">

                    <img
                        src="https://images.unsplash.com/photo-1493229042586-5c9e9e4a5a0a?auto=format&fit=crop&w=1000&q=80"
                        alt="Lighting project">

                </div>


                <!-- REPAIRS 2 -->

                <div
                    class="edkal-gallery-item"
                    data-category="repairs">

                    <img
                        src="https://images.unsplash.com/photo-1509391366360-2e959784a276?auto=format&fit=crop&w=1000&q=80"
                        alt="Electrical repair project">

                </div>


            </div>

        </div>

    </section>



    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {


                /* Get gallery tabs */

                const galleryTabs =
                    document.querySelectorAll(
                        ".edkal-gallery-tab"
                    );


                /* Get gallery items */

                const galleryItems =
                    document.querySelectorAll(
                        ".edkal-gallery-item"
                    );


                /* =================================
                   TAB CLICK
                ================================== */

                galleryTabs.forEach(
                    function (tab) {


                        tab.addEventListener(
                            "click",
                            function () {


                                /* Selected category */

                                const selectedCategory =
                                    this.getAttribute(
                                        "data-filter"
                                    );


                                /* -------------------------
                                   ACTIVE TAB
                                ------------------------- */

                                galleryTabs.forEach(
                                    function (button) {

                                        button.classList.remove(
                                            "active"
                                        );

                                    }
                                );


                                this.classList.add(
                                    "active"
                                );


                                /* -------------------------
                                   FILTER IMAGES
                                ------------------------- */

                                galleryItems.forEach(
                                    function (item) {


                                        const itemCategory =
                                            item.getAttribute(
                                                "data-category"
                                            );


                                        if (
                                            selectedCategory ===
                                            "all"
                                            ||
                                            itemCategory ===
                                            selectedCategory
                                        ) {

                                            item.classList.remove(
                                                "hidden"
                                            );

                                        }

                                        else {

                                            item.classList.add(
                                                "hidden"
                                            );

                                        }

                                    }
                                );

                            }
                        );

                    }
                );

            }
        );

    </script>


</body>

</html>
